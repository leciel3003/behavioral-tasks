<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>행동과제</title>
  <style>
    :root {
      --bg: #ffffff;
      --surface: #ffffff;
      --ink: #172326;
      --muted: #667276;
      --line: #d6ddda;
      --button-top: #f0f2f2;
      --button-bottom: #d9ddde;
      --button-shadow: #aeb5b7;
      font-family: "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", Arial, sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--ink);
    }
    button, input { font: inherit; -webkit-tap-highlight-color: transparent; }
    button { cursor: pointer; touch-action: manipulation; }
    button:focus-visible, input:focus-visible {
      outline: 3px solid rgba(35, 111, 107, .25);
      outline-offset: 2px;
    }

    .app {
      width: min(520px, calc(100% - 32px));
      display: grid;
      justify-items: center;
      gap: 28px;
      padding: 28px 0;
      text-align: center;
    }
    header { display: grid; gap: 10px; }
    h1 {
      margin: 0;
      font-size: clamp(32px, 7vw, 48px);
      line-height: 1.12;
      letter-spacing: 0;
    }
    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.45;
    }
    .identity {
      width: min(340px, 100%);
      display: grid;
      gap: 10px;
      justify-items: stretch;
    }
    label {
      color: var(--muted);
      font-size: 16px;
      font-weight: 700;
    }
    input {
      width: 100%;
      min-height: 58px;
      padding: 12px 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--ink);
      text-align: center;
      font-size: 20px;
    }
    .task-button {
      width: min(360px, 100%);
      min-height: 150px;
      padding: 18px 16px;
      border: 1px solid #b8bec0;
      border-radius: 10px;
      background: linear-gradient(180deg, var(--button-top) 0%, var(--button-bottom) 100%);
      color: #303638;
      font-weight: 800;
      line-height: 1.3;
      text-align: center;
      display: grid;
      align-content: center;
      justify-items: center;
      box-shadow: 0 7px 0 var(--button-shadow), 0 12px 18px rgba(45, 52, 54, .16);
      transition: transform 100ms ease, box-shadow 100ms ease, background 100ms ease;
    }
    .task-button strong {
      display: block;
      font-size: clamp(24px, 5vw, 32px);
    }
    .task-button:hover {
      transform: translateY(-2px);
      background: linear-gradient(180deg, #f7f8f8 0%, #e0e4e5 100%);
      box-shadow: 0 9px 0 var(--button-shadow), 0 15px 22px rgba(45, 52, 54, .2);
    }
    .task-button:active {
      transform: translateY(6px);
      box-shadow: 0 1px 0 var(--button-shadow), 0 5px 9px rgba(45, 52, 54, .12);
    }
    .status {
      min-height: 24px;
      margin: 0;
      color: #9b3f2f;
      font-size: 15px;
      line-height: 1.45;
    }
    .completion-screen {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
      background: #ffffff;
      color: #111111;
      font-size: clamp(25px, 4.8vw, 42px);
      font-weight: 700;
      line-height: 1.35;
      text-align: center;
      white-space: pre-line;
    }

    @media (max-width: 480px) {
      .app { width: calc(100% - 24px); gap: 22px; }
      h1 { font-size: clamp(30px, 9vw, 38px); }
      .subtitle { font-size: 16px; }
      .task-button { min-height: 136px; }
      .task-button strong { font-size: 24px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <h1>행동과제</h1>
      <p class="subtitle">세션 번호를 입력한 뒤 과제를 시작해 주세요.</p>
    </header>

    <section class="identity" aria-labelledby="session-label">
      <label id="session-label" for="participantId">세션 번호</label>
      <input id="participantId" type="text" autocomplete="off" inputmode="text" placeholder="세션 번호 입력">
    </section>

    <button class="task-button" type="button" id="paintOnlyBtn">
      <strong>물감 모으기</strong>
    </button>

    <p id="status" class="status" role="status" aria-live="polite"></p>
  </main>

  <script>
    const SHEET_URL = "https://script.google.com/macros/s/AKfycbwPbSnnB-OQPT15lBwMk7f9yaiZexMsY4HV2TrW-gyJ7ylFNIxIrf19rSEpFvx0iJfOww/exec";
    const participantId = document.getElementById("participantId");
    const status = document.getElementById("status");
    const paintOnlyBtn = document.getElementById("paintOnlyBtn");

    function makeId(prefix) {
      if (crypto && typeof crypto.randomUUID === "function") return `${prefix}-${crypto.randomUUID()}`;
      return `${prefix}-${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    function beginPaintOnly() {
      const id = participantId.value.trim();
      if (!id) {
        status.textContent = "세션 번호를 입력해 주세요.";
        participantId.focus();
        return;
      }

      const workflow = {
        participant_id: id,
        entry_condition: "paint_only",
        workflow_session_id: makeId("workflow"),
        sheet_url: SHEET_URL,
        auto_upload: true,
        tasks: ["paint"],
        current_index: 0,
        started_at: new Date().toISOString()
      };
      sessionStorage.setItem("behavioralTaskWorkflow", JSON.stringify(workflow));
      localStorage.setItem("behavioralTaskParticipantId", id);
      window.location.href = "paint.html?entry=paint_only";
    }

    function showCompletionScreen() {
      sessionStorage.removeItem("behavioralTaskWorkflow");
      document.body.innerHTML = `
        <main class="completion-screen" role="status" aria-live="polite">
          <div>
            <div>실험이 종료되었습니다.<br>감사합니다.</div>
            <button class="task-button" type="button" id="backToMainBtn" style="margin-top:32px;min-height:72px;width:min(320px,80vw);">
              메인 페이지로 돌아가기
            </button>
          </div>
        </main>
      `;
      document.getElementById("backToMainBtn").addEventListener("click", () => {
        history.replaceState(null, "", location.pathname);
        window.location.href = "main.html";
      });
    }

    if (new URLSearchParams(location.search).get("completed") === "1") {
      showCompletionScreen();
    } else {
      participantId.value = localStorage.getItem("behavioralTaskParticipantId") || "";
      paintOnlyBtn.addEventListener("click", beginPaintOnly);
      participantId.addEventListener("input", () => { status.textContent = ""; });
      participantId.addEventListener("keydown", (event) => {
        if (event.key === "Enter") beginPaintOnly();
      });
    }
  </script>
</body>
</html>
